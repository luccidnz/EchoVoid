name: Build phone APK

on:
  push:
    branches:
      - rebuild/ech0void-core-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm install

      - name: Verify Expo dependency alignment
        run: npx expo install --check

      - name: Generate native Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare phone APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Ech0Void-v2-phone.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ech0Void-v2-phone-apk
          path: Ech0Void-v2-phone.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish/update direct phone download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view phone-build --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit phone-build --repo "$GITHUB_REPOSITORY" --title "Ech0Void V2 Phone Build" --notes "Installable Android test APK built automatically from rebuild/ech0void-core-v2. This is a debug/test build, not the final Play Store release."
          else
            gh release create phone-build --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Ech0Void V2 Phone Build" --notes "Installable Android test APK built automatically from rebuild/ech0void-core-v2. This is a debug/test build, not the final Play Store release."
          fi
          gh release upload phone-build Ech0Void-v2-phone.apk --repo "$GITHUB_REPOSITORY" --clobber
