name: Build VOID Canary 57 APK

on:
  push:
    branches:
      - diagnostic/ech0void-phone-canary57
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-canary57:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: canary57

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install isolated SDK 57 dependencies
        run: npm install

      - name: Verify isolated autolinking
        run: npx expo-modules-autolinking react-native-config --platform android

      - name: Generate isolated SDK 57 Android project
        env:
          CI: '1'
          NODE_ENV: production
        run: npx expo prebuild --platform android --clean

      - name: Configure ARM64 release
        working-directory: canary57/android
        run: |
          cat >> gradle.properties <<'EOF'
          reactNativeArchitectures=arm64-v8a
          android.enableMinifyInReleaseBuilds=false
          android.enableShrinkResourcesInReleaseBuilds=false
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          EOF

      - name: Build SDK 57 release APK
        working-directory: canary57/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk VOID-Canary-57-arm64.apk
          ls -lh VOID-Canary-57-arm64.apk
          sha256sum VOID-Canary-57-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOID-Canary-57-arm64
          path: canary57/VOID-Canary-57-arm64.apk
          if-no-files-found: error
          retention-days: 7
