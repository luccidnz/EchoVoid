name: Build Ech0Void Canary APK

on:
  push:
    branches:
      - diagnostic/ech0void-phone-canary
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install minimal dependencies
        run: npm install

      - name: Generate clean Android project
        env:
          CI: '1'
          NODE_ENV: production
        run: npx expo prebuild --platform android --clean

      - name: Restrict to ARM64
        working-directory: android
        run: |
          cat >> gradle.properties <<'EOF'
          reactNativeArchitectures=arm64-v8a
          android.enableMinifyInReleaseBuilds=false
          android.enableShrinkResourcesInReleaseBuilds=false
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m
          EOF

      - name: Build release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Ech0Void-Canary-001-arm64.apk
          ls -lh Ech0Void-Canary-001-arm64.apk
          sha256sum Ech0Void-Canary-001-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ech0Void-Canary-001-arm64
          path: Ech0Void-Canary-001-arm64.apk
          if-no-files-found: error
          retention-days: 7
