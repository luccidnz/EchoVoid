name: Build VOID Native Test APK

on:
  push:
    branches:
      - diagnostic/ech0void-native-canary
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build native debug APK
        working-directory: nativecanary
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp nativecanary/app/build/outputs/apk/debug/app-debug.apk VOID-NATIVE-TEST.apk
          ls -lh VOID-NATIVE-TEST.apk
          sha256sum VOID-NATIVE-TEST.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOID-NATIVE-TEST
          path: VOID-NATIVE-TEST.apk
          if-no-files-found: error
          retention-days: 7
