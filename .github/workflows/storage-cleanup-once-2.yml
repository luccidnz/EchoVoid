name: One-shot artifact storage cleanup 2

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/storage-cleanup-once-2.yml"

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete remaining superseded EchoVoid APK artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ids=(9612149364 9610173689)
          for id in "${ids[@]}"; do
            echo "Deleting artifact $id"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
          done
          echo "Deleted ${#ids[@]} artifacts."
