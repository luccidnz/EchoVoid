name: Build Ech0Void HSB Core V4 APK

on:
  push:
    branches:
      - rebuild/ech0void-hsb-core-v4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hsb-core-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Validate bank builder syntax
        run: python3 -m py_compile nativeapp/tools/build_wordless_banks.py

      - name: Render HSB-style single-speaker banks
        run: |
          set -euo pipefail
          python3 nativeapp/tools/build_wordless_banks.py
          echo "Rendered banks:"
          ls -lh nativeapp/app/src/main/res/raw/bank_*.wav
          cat nativeapp/app/src/main/res/raw/bank_manifest.json

      - name: Prove banks are long unique finished streams
        run: |
          python3 - <<'PY'
          import hashlib, json, wave
          from pathlib import Path

          raw = Path("nativeapp/app/src/main/res/raw")
          wavs = sorted(raw.glob("bank_*.wav"))
          expected = {
              "bank_middle_female_a.wav",
              "bank_female_b.wav",
              "bank_female_c.wav",
              "bank_male_a.wav",
              "bank_male_b.wav",
              "bank_older_male_a.wav",
              "bank_voice_a.wav",
              "bank_mixed.wav",
          }
          names = {p.name for p in wavs}
          if names != expected:
              raise SystemExit(f"bank set mismatch: {sorted(names)}")

          hashes = {}
          for path in wavs:
              h = hashlib.sha256(path.read_bytes()).hexdigest()
              with wave.open(str(path), "rb") as w:
                  duration = w.getnframes() / w.getframerate()
                  print(path.name, f"{duration:.1f}s", h[:16])
                  if w.getnchannels() != 1 or w.getsampwidth() != 2 or w.getframerate() != 16000:
                      raise SystemExit(f"bad PCM format: {path.name}")
                  if duration < 175:
                      raise SystemExit(f"bank too short: {path.name} {duration:.1f}s")
              if h in hashes:
                  raise SystemExit(f"duplicate WAV: {path.name} == {hashes[h]}")
              hashes[h] = path.name

          manifest = json.loads((raw / "bank_manifest.json").read_text())
          if len(manifest) != 8:
              raise SystemExit(f"expected 8 manifest entries, got {len(manifest)}")
          for item in manifest:
              if item["chunks"] < 85:
                  raise SystemExit(f"too few chunks: {item['resource']}")
              if item["unique_chunk_count"] < 85:
                  raise SystemExit(f"too much repetition: {item['resource']}")
              if item["resource"] != "bank_mixed":
                  if "reverse" not in item["processing_order"] or "50% speed" not in item["processing_order"]:
                      raise SystemExit(f"processing order not recorded: {item['resource']}")

          mixed = next(x for x in manifest if x["resource"] == "bank_mixed")
          if len(mixed.get("unique_profiles", [])) < 6:
              raise SystemExit("mixed bank lacks source-profile diversity")
          PY

      - name: Build native Android APK
        working-directory: nativeapp
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare phone APK
        run: |
          cp nativeapp/app/build/outputs/apk/debug/app-debug.apk Ech0Void-HSB-Core-V4-test.apk
          ls -lh Ech0Void-HSB-Core-V4-test.apk
          sha256sum Ech0Void-HSB-Core-V4-test.apk | tee Ech0Void-HSB-Core-V4-test.sha256

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: Ech0Void-HSB-Core-V4-test
          path: |
            Ech0Void-HSB-Core-V4-test.apk
            Ech0Void-HSB-Core-V4-test.sha256
          if-no-files-found: error
          retention-days: 14
