name: Build Ech0Void Real Banks APK

on:
  push:
    branches:
      - rebuild/ech0void-native-v3-real-banks
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-v3-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Render real long wordless banks
        run: |
          set -euo pipefail
          python3 nativeapp/tools/build_wordless_banks.py
          echo "Rendered bank files:"
          ls -lh nativeapp/app/src/main/res/raw/bank_*.wav
          echo "Bank manifest:"
          cat nativeapp/app/src/main/res/raw/bank_manifest.json

      - name: Validate banks are real and distinct
        run: |
          python3 - <<'PY'
          import hashlib, json, wave
          from pathlib import Path

          raw = Path("nativeapp/app/src/main/res/raw")
          wavs = sorted(raw.glob("bank_*.wav"))
          if len(wavs) != 6:
              raise SystemExit(f"expected 6 banks, got {len(wavs)}")

          hashes = {}
          for path in wavs:
              data = path.read_bytes()
              h = hashlib.sha256(data).hexdigest()
              with wave.open(str(path), "rb") as w:
                  dur = w.getnframes() / w.getframerate()
                  print(path.name, f"{dur:.1f}s", h[:16])
                  if dur < 110:
                      raise SystemExit(f"{path.name} is too short: {dur}")
              if h in hashes:
                  raise SystemExit(f"duplicate bank audio: {path.name} == {hashes[h]}")
              hashes[h] = path.name

          manifest = json.loads((raw / "bank_manifest.json").read_text())
          for item in manifest:
              if item["chunks"] < 55:
                  raise SystemExit(f"too few chunks in {item['name']}")
              if item["unique_source_count"] < 1:
                  raise SystemExit(f"no source diversity in {item['name']}")
          PY

      - name: Build native Android APK
        working-directory: nativeapp
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare phone APK
        run: |
          cp nativeapp/app/build/outputs/apk/debug/app-debug.apk Ech0Void-Real-Banks-test.apk
          ls -lh Ech0Void-Real-Banks-test.apk
          sha256sum Ech0Void-Real-Banks-test.apk | tee Ech0Void-Real-Banks-test.sha256

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: Ech0Void-Real-Banks-test
          path: |
            Ech0Void-Real-Banks-test.apk
            Ech0Void-Real-Banks-test.sha256
          if-no-files-found: error
          retention-days: 14
