name: Build Ech0Void Native V3 APK

on:
  push:
    branches:
      - rebuild/ech0void-native-v3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-v3-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build native Android APK
        working-directory: nativeapp
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare phone APK
        run: |
          cp nativeapp/app/build/outputs/apk/debug/app-debug.apk Ech0Void-Native-V3-test.apk
          ls -lh Ech0Void-Native-V3-test.apk
          sha256sum Ech0Void-Native-V3-test.apk | tee Ech0Void-Native-V3-test.sha256

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: Ech0Void-Native-V3-test
          path: |
            Ech0Void-Native-V3-test.apk
            Ech0Void-Native-V3-test.sha256
          if-no-files-found: error
          retention-days: 14
